<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreshMarket</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <h1>Fresh<span>Market</span></h1>

    <input id="search" type="search" autocomplete="off"
           placeholder="Search for your favorite products..."
           aria-label="Search products">
  </header>

  <main class="layout">
    <section aria-labelledby="catalog-title">
      <h2 id="catalog-title">Popular products</h2>
      <p id="status" class="muted" role="status"></p>
      <div id="grid" class="grid"></div>
    </section>

    <aside class="cart" aria-labelledby="cart-title">
      <h2 id="cart-title">
        Your cart <span id="cart-count" class="badge">0</span>
      </h2>

      <ul id="cart-items" class="cart-items"></ul>

      <p id="cart-empty" class="muted">
        The cart is empty. Add something from the catalog.
      </p>

      <button id="buy" class="primary" disabled>Buy</button>
    </aside>
  </main>

  <dialog id="order">
    <form method="dialog" class="order-head">
      <h2>Thanks for your order!</h2>
      <button class="ghost" aria-label="Close">Close</button>
    </form>

    <p class="muted" id="order-summary"></p>

    <h3>You might also want to buy</h3>

    <p id="order-status" class="muted" role="status"></p>

    <div id="recs" class="grid"></div>
  </dialog>

  <script src="product-images.js"></script>
  <script src="app.js"></script>

</body>
</html>
